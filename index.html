<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>減重手帳</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="減重手帳"><meta name="theme-color" content="#F2F0EB">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap">
<style>
/* Layout: one narrow paper-like column, hairline-ruled sections instead of cards, fixed 5-tab bar at the bottom (Muji: plain, quiet, natural dyes). */
:root{
  --bg:#F2F0EB; --surface:#FAF9F6; --line:#DCD6CA; --ink:#35322D; --ink2:#766F63; --ink3:#A39C8E;
  --accent:#7F0019; --accent-ink:#FFFFFF; --accent-soft:#EDE2E0;
  --indigo:#51697F; --kraft:#A58B5E; --clay:#A8705A; --sage:#76896F;
  --warn:#8F6418; --ok:#56724F;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Jost","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1B18; --surface:#262420; --line:#3A3631; --ink:#ECE7DD; --ink2:#A69F92; --ink3:#797367;
    --accent:#DB8590; --accent-ink:#1D1B18; --accent-soft:#3B2B2E;
    --indigo:#91AAC1; --kraft:#C9AF84; --clay:#D09680; --sage:#9DB097;
    --warn:#D5A857; --ok:#9DB99A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1B18; --surface:#262420; --line:#3A3631; --ink:#ECE7DD; --ink2:#A69F92; --ink3:#797367;
  --accent:#DB8590; --accent-ink:#1D1B18; --accent-soft:#3B2B2E;
  --indigo:#91AAC1; --kraft:#C9AF84; --clay:#D09680; --sage:#9DB097;
  --warn:#D5A857; --ok:#9DB99A; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font:400 15px/1.65 var(--font-ui);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px 112px;
  min-height:100%;
}
.app{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--ink2)}
.small{font-size:13px}
.cap{font-size:12px;color:var(--ink2)}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
.label{font-size:12px;letter-spacing:.12em;color:var(--ink2);font-weight:500}
.sec{padding-block:20px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}

/* page head */
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px 4px}
.head h1{font-size:20px;letter-spacing:.04em}
.head .d{display:flex;align-items:center;gap:4px}
.iconbtn{border:0;background:none;width:36px;height:36px;display:grid;place-items:center;border-radius:4px;color:var(--ink)}
.iconbtn:hover{background:var(--line)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* controls */
.btn{border:1px solid var(--ink);background:transparent;border-radius:4px;padding:9px 16px;font-size:14px;letter-spacing:.04em;min-height:40px}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.input,.select,.textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:9px 12px;font-size:16px;min-height:42px}
.textarea{min-height:84px;resize:vertical;line-height:1.55}
.input::placeholder,.textarea::placeholder{color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:4px;padding:6px 12px;font-size:14px;min-height:34px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}

.msg{font-size:13px;color:var(--ink2);padding:8px 0}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.cal .wd{font-size:12px;color:var(--ink2);text-align:center;padding-block:8px}
.cal button.c{border:0;border-top:1px solid var(--line);background:none;min-height:56px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;border-radius:0}

.cal button.c .w{font:300 11px var(--font-num);color:var(--ink2)}
.cal button.c.out{visibility:hidden}

.kv>div span:first-child{color:var(--ink2)}
.kv>div span:last-child{font-family:var(--font-num)}

/* chart */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tx{font:300 10px var(--font-num);fill:var(--ink2)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}

/* prediction */
.pred .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pred .big .num{font-size:48px;font-weight:300;line-height:1.1}
.pred .big .u{color:var(--ink2);font-size:14px}
.delta{font-family:var(--font-num);font-size:18px}

.stackbar{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--line);gap:2px}
.stackbar i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:8px}

.sw{display:inline-block;width:8px;height:8px;border-radius:1px;margin-right:6px}
.note{font-size:13px;color:var(--ink2);border-left:2px solid var(--line);padding:2px 0 2px 12px}

.coach{white-space:pre-wrap;font-size:14px;line-height:1.75}
.recipe{border-top:1px solid var(--line)}
.recipe summary{list-style:none;cursor:pointer;padding-block:14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.recipe summary::-webkit-details-marker{display:none}
.recipe summary b{font-weight:500}
.recipe .body{padding-bottom:16px;display:flex;flex-direction:column;gap:12px}
.recipe ol,.recipe ul{margin:0;padding-left:20px}
.recipe li{margin-block:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(30,26,20,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:8px 8px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom, 0px));border:1px solid var(--line);border-bottom:0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-h h2{font-size:17px}
.srow{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:8px}
.srow .nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.srow .nums label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ink2)}
.srow .nums .input{padding:6px 8px;min-height:38px;font-size:15px}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;color:var(--ink3);font-size:11px;letter-spacing:.08em;min-height:52px;border-radius:4px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.authbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);margin:8px 0 4px}
.dot2{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block;flex:none}
.dot2.on{background:var(--ok)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.loading{padding-block:80px;text-align:center;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .35s ease}}
</style>

</head><body>
<div class="app" id="app"><div class="loading">讀取中…</div></div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-h"><h2 id="sheetTitle"></h2><button class="btn text" data-a="closeSheet" type="button">關閉</button></div>
    <div id="sheetBody"></div>

</div>

<div class="tabs" id="tabs" hidden>
  <nav aria-label="主選單">
    <button type="button" data-a="tab" data-v="today"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1.6 1-1.6 1-3.2M14 7c0-1.6 1-1.6 1-3.2"/></svg>今日</button>
    <button type="button" data-a="tab" data-v="move"><svg viewBox="0 0 24 24"><path d="M6.5 8v8M3.5 10v4M17.5 8v8M20.5 10v4M6.5 12h11"/></svg>運動</button>
    <button type="button" data-a="tab" data-v="log"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="1.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>紀錄</button>

    <button type="button" data-a="tab" data-v="fast"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>斷食</button>
    <button type="button" data-a="tab" data-v="me"><svg viewBox="0 0 24 24"><path d="M5 8h14M5 16h14"/><circle cx="9" cy="8" r="2" fill="var(--bg)"/><circle cx="15" cy="16" r="2" fill="var(--bg)"/></svg>設定</button>
  </nav>
</div>

<script>
(function(){
'use strict';

/* ---------- Gemini API Setup ---------- */
let GEMINI_API_KEY = localStorage.getItem('wl-gemini-key') || '';

let DETECTED_MODEL = null;

async function getSupportedModel(key) {
  if (DETECTED_MODEL) return DETECTED_MODEL;
  try {
    const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
    if (listRes.ok) {
      const data = await listRes.json();
      const names = (data.models || [])
        .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
        .map(m => m.name.replace(/^models\//, ''));
      // 自動挑「版本號最高」的穩定版 flash(例:gemini-3.8-flash),不寫死版本,Google 之後再換也不用改程式
      const stable = names
        .map(n => ({ n, m: n.match(/^gemini-(\d+(?:\.\d+)?)-flash$/) }))
        .filter(x => x.m)
        .sort((a, b) => parseFloat(b.m[1]) - parseFloat(a.m[1]));
      const pick = (stable[0] && stable[0].n) ||
        names.find(n => n === 'gemini-flash-latest') ||
        names.find(n => n.includes('flash') && !/vision|thinking|image|tts|live|preview|exp|lite/.test(n));
      if (pick) {
        DETECTED_MODEL = pick;
        return pick;
      }
    }
  } catch(e) {
    console.warn('ListModels failed, falling back:', e);
  }
  // 偵測失敗時用 Google 提供的「最新版」別名,會自動指向目前的 flash 模型
  return 'gemini-flash-latest';
}

async function callGemini(prompt, isJson = false, extraConfig = {}) {
  if (!GEMINI_API_KEY) {
    const key = window.prompt('請輸入你的 Google Gemini API Key：');
    if (!key) throw new Error('未提供 API Key');
    GEMINI_API_KEY = key.trim();
    localStorage.setItem('wl-gemini-key', GEMINI_API_KEY);
    S.ai = true;
  }

  // 自動向 Google 查詢該 Key 真正支援的模型名稱
  const activeModel = await getSupportedModel(GEMINI_API_KEY);
  const models = [activeModel, 'gemini-flash-latest'].filter((v, i, a) => v && a.indexOf(v) === i);
  let lastErr = null;
  const errs = [];

  for (const m of models) {
    try {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${GEMINI_API_KEY}`;
      const bodyData = {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: Object.assign({}, isJson ? { responseMimeType: "application/json" } : {},
          /^gemini-3/.test(m) || m === 'gemini-flash-latest' ? { thinkingConfig: { thinkingLevel: 'low' } } : {}, extraConfig)
      };

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 60000);
      let res;
      try {
        res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData),
          signal: controller.signal
        });
      } finally {
        clearTimeout(timer);
      }

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${res.status}`);
      }

      const data = await res.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error('Gemini 回傳為空');

      DETECTED_MODEL = m; // 記住成功連線的模型
      return isJson ? JSON.parse(text) : text;
    } catch(err) {
      lastErr = err;
      if (err.name === 'AbortError' || /abort/i.test(err.message || '')) {
        throw new Error('Gemini 回應逾時(超過 60 秒),請檢查網路後再試一次');
      }
      errs.push(m + ': ' + (err.message || err.name));
      DETECTED_MODEL = null; // 這個模型失敗了,下次重新偵測
      const msg = (err.message || err.name || '').toLowerCase();
      if (msg.includes('model') || msg.includes('404') || msg.includes('available') || msg.includes('abort') || msg.includes('timeout')) {
        continue;
      }
      throw err;
    }
  }

  // 把每個模型各自的錯誤都帶出來,方便除錯
  throw new Error(errs.join(' | ') || (lastErr && lastErr.message) || '所有 Gemini 模型連線皆失敗');
}


/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayStr=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const dayNum=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/86400000)};
const numLabel=n=>{const d=new Date(n*86400000);return (d.getUTCMonth()+1)+'/'+d.getUTCDate()};
const WD=['日','一','二','三','四','五','六'];
const fmt=(n,dp=0)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:dp,minimumFractionDigits:dp});
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
const r1=v=>Math.round((+v||0)*10)/10;
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,9);
const MEALS=[['b','早餐'],['l','午餐'],['d','晚餐'],['s','點心']];
const mealName=k=>(MEALS.find(m=>m[0]===k)||[,'點心'])[1];
const mealNow=()=>{const h=new Date().getHours();return h<10?'b':h<14?'l':h<17?'s':h<21?'d':'s'};

const CN={'半':.5,'一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
const QRE=/(\d+(?:\.\d+)?|[半一二兩三四五六七八九十])\s*(公克|克|毫升|ml|cc|g|碗|個|顆|份|杯|片|根|條|塊|盤|包|瓶|碟|隻|粒|匙|盒|串|張|罐|球|支)?/i;
function localEstimate(text){
  const list=[],miss=[];
  const segs=[],isQ=t=>/^[\d.半一二兩三四五六七八九十]/.test(t),hasF=t=>allFoods().some(f=>f[1].some(k=>t.indexOf(k)>=0));
  text.split(/[、,，;；\n+＋]|和|跟|還有/).map(x=>x.trim()).filter(Boolean).forEach(part=>{
    const g=[];let pre='';
    part.split(/\s+/).filter(Boolean).forEach(tok=>{
      if(hasF(tok)){g.push(pre+tok);pre=''}
      else if(isQ(tok)){if(g.length) g[g.length-1]+=' '+tok;else pre+=tok+' '}
      else g.push(tok);
    });
    if(pre) g.push(pre.trim());
    g.forEach(x=>segs.push(x));
  });
  segs.forEach(seg=>{
    let best=null,bk='';
    allFoods().forEach(f=>f[1].forEach(k=>{if(seg.indexOf(k)>=0&&k.length>bk.length){best=f;bk=k}}));
    if(!best){miss.push(seg);list.push({name:seg.slice(0,40),qty:'',kcal:0,p:0,c:0,f:0});return}
    let q=1;const m=seg.replace(bk,'').match(QRE);
    if(m){
      const n=/^[\d.]/.test(m[1])?parseFloat(m[1]):CN[m[1]],u=(m[2]||'').toLowerCase();
      if(n>0){
        if(['g','克','公克','ml','毫升','cc'].indexOf(u)>=0||(!u&&n>20)){if(best[3]) q=n/best[3]}
        else q=n;
      }
    }
    q=Math.min(q,20);
    list.push({name:best[0],qty:best[2]+(Math.abs(q-1)>0.001?' ×'+Math.round(q*100)/100:''),kcal:Math.round(best[4]*q),p:r1(best[5]*q),c:r1(best[6]*q),f:r1(best[7]*q)});
  });
  return {list,miss};
}

const Store={col:null,chains:{},
  async init(){
    try{
      if(!window.claude||!window.claude.use) throw 0;
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      const id=user?await user.id():null;
      if(db&&id){this.col=db.collection('data/users/'+id);S.mode='cloud'}
    }catch(e){}
    if(this.col){
      try{
        const snap=await this.col.get();
        snap.docs.forEach(d=>{
          if(d.id==='profile') S.profile=clone(d.data());
          else if(d.id.indexOf('d-')===0) S.days[d.id.slice(2)]=norm(clone(d.data()));
        });
        return;
      }catch(e){S.mode='local';this.col=null}
    }
    try{
      const raw=localStorage.getItem('wl-v1');
      if(raw){const o=JSON.parse(raw);S.profile=o.profile||null;Object.keys(o.days||{}).forEach(k=>S.days[k]=norm(o.days[k]))}
    }catch(e){}
  },
  write(id,data){
    if(!this.col){
      try{localStorage.setItem('wl-v1',JSON.stringify({profile:S.profile,days:S.days}))}catch(e){}
      return;
    }
    const body=clone(data);
    this.chains[id]=(this.chains[id]||Promise.resolve()).then(()=>this.col.doc(id).set(body)).catch(()=>{toast('儲存失敗,請稍後再試。',true)});
  }

const bmr=(p,w)=>Math.round(10*w+6.25*p.height-5*p.age+(p.sex==='m'?5:-161));
function totals(date){
  const d=getDay(date),t={kcal:0,p:0,c:0,f:0};
  d.foods.forEach(f=>{t.kcal+=+f.kcal||0;t.p+=+f.p||0;t.c+=+f.c||0;t.f+=+f.f||0});
  const manual=d.workouts.reduce((a,w)=>a+(+w.kcal||0),0);
  const mins=d.workouts.reduce((a,w)=>a+(+w.min||0),0);
  const watch=+(d.watch&&d.watch.active)||0;
  return Object.assign(t,{manual,watch,burn:watch||manual,mins:(d.watch&&+d.watch.mins)||mins,steps:+(d.watch&&d.watch.steps)||0});
}
function targets(){
  const p=S.profile,w=weightAt(todayStr())||p.weight;
  const P=Math.round(1.6*w),F=Math.round(p.kcal*0.27/9),C=Math.max(0,Math.round((p.kcal-P*4-F*9)/4));
  return {p:P,c:C,f:F};
}
function forecast(){
  const p=S.profile,t0=todayStr(),w=weightAt(t0)||p.weight,b=bmr(p,w),base=Math.round(b*p.act);
  let win=[],basis='past';
  for(let i=1;i<=7;i++){const d=addDays(t0,-i),t=totals(d);if(t.kcal>0) win.push(t)}
  if(!win.length){const t=totals(t0);if(t.kcal>0){win.push(t);basis='today'}}
  let intake,burn,mac=null;
  if(!win.length){intake=p.kcal;burn=0;basis='goal'}
  else{
    const n=win.length,sum=k=>win.reduce((a,x)=>a+x[k],0)/n;
    intake=sum('kcal');burn=sum('burn');mac={p:sum('p'),c:sum('c'),f:sum('f')};
  }
  const out=base+burn,delta=intake-out,week=delta*7/7700;
  return {w,b,base,n:win.length,basis,intake,burn,out,delta,week,proj:w+week,mac};
}

/* chart */
function niceTicks(min,max,n){
  const raw=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(raw||1)));
  const step=[1,2,2.5,5,10].map(s=>s*mag).find(s=>s>=raw)||mag*10;
  const out=[];for(let v=Math.ceil(min/step)*step;v<=max+1e-9;v+=step) out.push(Math.round(v*1000)/1000);
  return out;
}
function lineChart(o){
  const W=340,H=o.h||190,L=38,R=16,T=16,B=26,series=o.series.filter(s=>s.pts.length);
  const all=series.flatMap(s=>s.pts);
  if(!all.length) return '';
  let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x));if(x0===x1){x0-=1;x1+=1}
  let ys=all.map(p=>p.y);if(o.goal!=null) ys=ys.concat(o.goal);
  let y0=Math.min(...ys),y1=Math.max(...ys);const pd=(y1-y0)*.18||1;y0-=pd;y1+=pd;
  const ticks=niceTicks(y0,y1,4);
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  const dp=o.dp==null?1:o.dp;
  let g='';
  ticks.forEach(v=>{g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tx" x="${L-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v,dp)}</text>`});
  const xl=[[x0,'start'],[Math.round((x0+x1)/2),'middle'],[x1,'end']];
  xl.forEach(([x,a])=>{g+=`<text class="tx" x="${X(x)}" y="${H-6}" text-anchor="${a}">${numLabel(x)}</text>`});
  if(o.goal!=null){g+=`<line class="goal" x1="${L}" x2="${W-R}" y1="${Y(o.goal)}" y2="${Y(o.goal)}"/><text class="gl" x="${W-R}" y="${Y(o.goal)-4}" text-anchor="end">目標 ${fmt(o.goal,dp)}</text>`}
  series.forEach((s,si)=>{
    const pts=s.pts.map(p=>[X(p.x),Y(p.y)]);
    const dd=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(o.area&&si===0&&pts.length>1) g+=`<path class="area" d="${dd} L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B}Z"/>`;
    if(pts.length>1) g+=`<path class="ln ${s.dash?'dash':''}" d="${dd}"/>`;
    if(!s.dash&&pts.length<=45) pts.forEach(p=>{g+=`<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4"/>`});
  });
  const last=series.filter(s=>!s.dash).pop();
  if(last){const lp=last.pts[last.pts.length-1],cx=X(lp.x),cy=Y(lp.y);
    g+=`<circle class="end" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4"/><text class="lb" x="${Math.min(cx,W-R)}" y="${cy>T+14?cy-9:cy+17}" text-anchor="${cx>W-40?'end':'middle'}">${fmt(lp.y,dp)}</text>`}
  const proj=series.find(s=>s.dash);
  if(proj){const lp=proj.pts[proj.pts.length-1];g+=`<text class="lb" x="${W-R}" y="${Y(lp.y)>T+14?Y(lp.y)-9:Y(lp.y)+17}" text-anchor="end" style="fill:var(--ink2)">${fmt(lp.y,dp)}</text>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'趨勢圖')}">${g}</svg>`;
}

function viewPlan(){
  const p=S.profile,f=forecast(),tg=targets();
  const wk=f.week,down=wk<-0.005;
  const basisTxt=f.basis==='past'?`依最近 ${f.n} 天的飲食紀錄推算`:f.basis==='today'?'今天還沒吃完,數字會偏低;累積幾天紀錄會更準':'還沒有飲食紀錄,先以你的目標熱量推算';
  // projection chart
  const t0=dayNum(todayStr());
  const past=dateKeys().filter(k=>S.days[k].body&&S.days[k].body.weight!=null&&dayNum(k)>=t0-14).map(k=>({x:dayNum(k),y:S.days[k].body.weight}));
  if(!past.length) past.push({x:t0,y:f.w});
  const lastP=past[past.length-1];
  const projPts=[{x:lastP.x,y:lastP.y},{x:t0+7,y:f.w+wk}];
  const chart=lineChart({series:[{pts:past},{pts:projPts,dash:true}],goal:p.goal,label:'未來一週預估體重',h:170});
  // eta
  let eta='';
  if(f.w<=p.goal) eta='目前體重已達到目標。可以把熱量調高一點,開始維持。';
  else if(wk<-0.02){const weeks=(f.w-p.goal)/(-wk);const dt=new Date();dt.setDate(dt.getDate()+Math.round(weeks*7));eta=`照這個速度,約 ${weeks<1?'不到 1':fmt(weeks,weeks<10?1:0)} 週後達到 ${fmt(p.goal,1)} kg(${dt.getMonth()+1}/${dt.getDate()} 前後)。`}
  else eta='照目前的吃法,體重不會下降。可以先從減少每天 300 至 500 kcal 或多動一點開始。';
  // notes
  const notes=[];
  if(f.basis==='past'||f.basis==='today'){
    if(f.intake<f.b) notes.push(['warn',`平均攝取 ${fmt(f.intake)} kcal,低於你的基礎代謝約 ${fmt(f.b)} kcal。長期吃太少容易掉肌肉、情緒與睡眠也會受影響,建議補到基礎代謝以上。`]);
    if(wk<-0.01*f.w) notes.push(['warn',`預估每週減 ${fmt(-wk,2)} kg,超過體重的 1%,速度偏快。`]);
    if(f.mac){const pk=f.mac.p/f.w;notes.push([pk<1.2?'warn':'',`蛋白質平均每公斤體重 ${fmt(pk,1)} g(減脂期建議 1.6 g 以上,約 ${fmt(tg.p)} g/天)。`])}
  }
  if(p.goal/Math.pow(p.height/100,2)<18.5) notes.push(['warn','目標體重換算的 BMI 低於 18.5,建議和醫師或營養師確認目標。']);
  let macroHtml='';
  if(f.mac){
    const kc={p:f.mac.p*4,c:f.mac.c*4,f:f.mac.f*9},tot=kc.p+kc.c+kc.f||1,pc=k=>Math.round(kc[k]/tot*100);
    macroHtml=`<section class="sec"><div class="sec-h"><span class="label">營養比例(平均)</span></div>
      <div class="stackbar"><i style="width:${pc('p')}%;background:var(--indigo)"></i><i style="width:${pc('c')}%;background:var(--kraft)"></i><i style="width:${pc('f')}%;background:var(--clay)"></i></div>
      <div class="legend"><span><i class="sw" style="background:var(--indigo)"></i>蛋白質 <b>${pc('p')}%</b> ${fmt(f.mac.p)} g</span><span><i class="sw" style="background:var(--kraft)"></i>碳水 <b>${pc('c')}%</b> ${fmt(f.mac.c)} g</span><span><i class="sw" style="background:var(--clay)"></i>脂肪 <b>${pc('f')}%</b> ${fmt(f.mac.f)} g</span></div></section>`;
  }
  const rec=S.recipes;
  return `<div class="head"><h1>預測</h1></div>

const FAST_CAUTION='孕婦、哺乳期、糖尿病或正在用藥、體重過輕、或有飲食失調病史的人,請先諮詢醫師,不建議自行斷食。斷食時若出現頭暈、心悸或極度疲倦,請停止並進食。';
const hm=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m};
const fmtDur=min=>{const h=Math.floor(min/60),m=min%60;return h?h+' 小時 '+m+' 分':m+' 分'};
function fastRec(){
  const t0=todayStr(),days=[];
  for(let i=1;i<=7;i++){const ds=addDays(t0,-i);if(getDay(ds).foods.length) days.push(ds)}
  if(days.length<3) return {m:null,why:['先記錄至少 3 天飲食,才能依你的習慣推薦。']};
  let bfast=0,snacks=0,kcal=0,dk=0;
  days.forEach(ds=>{const fs=getDay(ds).foods;if(!fs.some(f=>f.meal==='b')) bfast++;snacks+=fs.filter(f=>f.meal==='s').length;fs.forEach(f=>{kcal+=+f.kcal||0;if(f.meal==='d') dk+=+f.kcal||0})});
  const n=days.length,avg=kcal/n,b=bmr(S.profile,weightAt(t0)||S.profile.weight),dShare=kcal?dk/kcal:0;
  const why=['近 '+n+' 天有紀錄,平均每天攝取 '+fmt(avg)+' kcal,基礎代謝約 '+fmt(b)+' kcal。'];
  if(avg<b*0.95) return {m:null,why:why.concat(['目前吃得偏少,先把攝取補到基礎代謝以上,不建議斷食。'])};
  if(bfast/n>=0.5){why.push('你常跳過早餐,所以把進食時段排在中午到晚上。');return {m:'16:8',start:'12:00',end:'20:00',why}}
  if(snacks/n>=1){why.push('你每天常吃點心,用 16:8 把進食時段收在下午,可以減少晚間點心。');return {m:'16:8',start:'10:00',end:'18:00',why}}
  if(dShare>0.45){why.push('晚餐佔全天熱量較多,採早吃型,把最後一餐提前。');return {m:'14:10',start:'07:00',end:'17:00',why}}
  why.push('你的飲食較規律,適合入門的 12:12,之後再視情況調整。');
  return {m:'12:12',start:'08:00',end:'20:00',why};
}
function fastState(f){
  const now=new Date(),nowM=now.getHours()*60+now.getMinutes(),s=hm(f.start),e=hm(f.end);
  const inWin=s<=e?(nowM>=s&&nowM<e):(nowM>=s||nowM<e);
  return {inWin,to:inWin?(e-nowM+1440)%1440:(s-nowM+1440)%1440};
}
const FASTS=[
 {m:'12:12',start:'08:00',end:'20:00',t:'入門',d:'禁食 12 小時、進食 12 小時。比較容易持續,適合剛開始。'},

async function estimate(){
  const text=$('#foodText').value.trim(),msg=$('#foodMsg'),btn=$('#estBtn');
  if(!text){msg.textContent='先寫下吃了什麼。';msg.className='msg err';return}
  btn.disabled=true;msg.className='msg';msg.textContent='Gemini 估算中…';
  let done=false;
  if(GEMINI_API_KEY){
    const prompt=`你是熟悉台灣飲食的營養師(便當、小吃、早餐店、超商、手搖飲都懂)。把下面這段飲食紀錄拆成一項一項的食物,估算每一項的份量與營養。
只回傳 JSON 陣列,每個元素格式:{"name":"食物名稱","qty":"份量,如 150g 或 1碗","kcal":整數,"p":蛋白質克數,"c":碳水克數,"f":脂肪克數}
份量沒寫時,用台灣常見的一人份。數字取整數或一位小數。除了 JSON 不要寫其他文字。

飲食紀錄:
${text}`;
    try{
      const arr=await callGemini(prompt, true);
      const list=(Array.isArray(arr)?arr:(arr&&arr.items)||[]).map(x=>({name:String(x.name||'').slice(0,40),qty:String(x.qty||'').slice(0,24),kcal:Math.max(0,Math.round(+x.kcal||0)),p:r1(x.p),c:r1(x.c),f:r1(x.f)})).filter(x=>x.name);
      if(list.length){S.stage=S.stage.concat(list);renderStage();msg.textContent='';done=true}
    }catch(e){console.error(e)}
  }
  if(!done){
    const r=localEstimate(text);
    S.stage=S.stage.concat(r.list);renderStage();
    msg.className='msg'+(r.miss.length?' err':'');
    msg.textContent=(r.miss.length?'找不到「'+r.miss.join('、')+'」,請自己填熱量。':'')+'已用內建食物表估算,份量以一般一人份計,請核對。';
  }
  btn.disabled=false;
}

async function coach(){
  if(!GEMINI_API_KEY){toast('請先設定 Gemini API Key');return}
  const p=S.profile,f=forecast(),tg=targets(),t0=todayStr();
  const rows=[];for(let i=1;i<=7;i++){const d=addDays(t0,-i),t=totals(d),w=getDay(d).body.weight;rows.push(`${d}:${t.kcal?`攝取${Math.round(t.kcal)}kcal 蛋白質${Math.round(t.p)}g 碳水${Math.round(t.c)}g 脂肪${Math.round(t.f)}g`:'未記錄飲食'},運動${Math.round(t.burn)}kcal${w?`,體重${w}kg`:''}`)}
  const prompt=`你是溫和務實的減重營養顧問,請用繁體中文(台灣用語)回答。
使用者:身高${p.height}cm、目前體重${f.w}kg、目標${p.goal}kg、${p.age}歲、${p.sex==='m'?'男':'女'}、目標熱量${p.kcal}kcal/天。
基礎代謝約${f.b}kcal,日常消耗約${f.base}kcal。依近期紀錄,每日平均攝取${Math.round(f.intake)}kcal、運動消耗${Math.round(f.burn)}kcal,預估一週體重變化${f.week.toFixed(2)}kg。蛋白質目標約${tg.p}g/天。
最近七天:
${rows.join('\n')}

請給 3 到 4 點具體、可以馬上做的建議(例如哪一餐怎麼換、蛋白質怎麼補、運動怎麼加),每點一到兩句,條列用「・」開頭。不要說教,不要重複上面的數字,不要寫標題或前言。`;
  S.coachBusy=true;render();
  try{
    const reply=await callGemini(prompt, false);
    S.coach=reply.trim();
  }catch(e){
    toast('Gemini 分析失敗: '+e.message, true);
  }finally{
    S.coachBusy=false;render();
  }
}
let lastRecipeNames = [];

function localRecipes(){
  const p=S.profile,t=totals(todayStr()),addBack=p.addBack!==false;
  const remain=Math.max(0,p.kcal+(addBack?t.burn:0)-t.kcal);
  const per={b:0.25,l:0.35,d:0.35,s:0.1}[S.rMeal];
  const budget=Math.max(150,Math.min(remain,p.kcal*per*1.4));
  const bad=(S.rPref.match(/不(?:吃|要|能吃)([^,,。;;\s]+)/g)||[]).reduce((a,x)=>a.concat(x.replace(/^不(?:吃|要|能吃)/,'').split(/[、和跟或]/)),[]).filter(Boolean);
  const mustKeywords = S.rPref.replace(/不(?:吃|要|能吃)[^,,。;;\s]+/g, '').split(/[\s,，、+＋]+/).filter(x => x.length >= 1);
  
  let list=RECIPES.filter(r=>{
    if(r.m.indexOf(S.rMeal)<0) return false;
    const fullText = r.name + r.ingredients.join('');
    if(bad.some(w => fullText.indexOf(w) >= 0)) return false;
    if(mustKeywords.length > 0 && !mustKeywords.some(k => fullText.indexOf(k) >= 0)) return false;
    return true;
  });

  if(!list.length) {
    list=RECIPES.filter(r=>r.m.indexOf(S.rMeal)>=0&&!bad.some(w=>(r.name+r.ingredients.join('')).indexOf(w)>=0));
  }
  if(!list.length) list=RECIPES.filter(r=>r.m.indexOf(S.rMeal)>=0);

  // 每次點選隨機洗牌，保證推薦菜色不同
  list = list.sort(() => Math.random() - 0.5);
  S.recipes=list.slice(0,3);
  S.busy=false;render();
  const m=$('#recipeMsg');if(m){m.className='msg';m.textContent='離線模式：已為你挑選符合條件的隨機食譜。'}
}

async function recipe(){
  S.rPref=($('#rPref')||{value:S.rPref}).value.trim();
  if(!GEMINI_API_KEY){localRecipes();return}
  const p=S.profile,t=totals(todayStr()),tg=targets(),addBack=p.addBack!==false;
  const remain=Math.max(0,p.kcal+(addBack?t.burn:0)-t.kcal),remP=Math.max(0,tg.p-t.p);
  const per={b:0.25,l:0.35,d:0.35,s:0.1}[S.rMeal];
  const budget=Math.max(150,Math.round(Math.min(remain,p.kcal*per*1.4)/10)*10);

  const avoidPrompt = lastRecipeNames.length ? `【請勿重複推薦以下菜色】：${lastRecipeNames.join('、')}。請發揮創意推薦全新菜單。` : '';
  const prefPrompt = S.rPref 
    ? `【最高優先級要求 - 使用者特別指定】：「${S.rPref}」。你推薦的每道菜必須百分之百嚴格遵循此要求（包含指定的食材、想吃的料理形式、特定器材如氣炸鍋/電鍋、或忌口排除項目，絕不可忽略）。`
    : '風格多樣化、清爽健康。';

  const prompt=`你是熟悉台灣家常與減脂料理的專業營養師。請為使用者推薦 3 道全新的「${mealName(S.rMeal)}」減脂料理。
核心條件：
1. ${prefPrompt}
2. 熱量目標：每道約 ${budget} kcal（上下 10%），蛋白質盡量高（今日蛋白質目標還缺約 ${Math.round(remP)}g）。
3. 方便性：食材在台灣全聯、家樂福、傳統市場或超商容易買到，一般家用爐具/電鍋/氣炸鍋 30 分鐘內可完成。
4. 多樣性：3 道菜餚之間風味與主要食材要有明顯差異。${avoidPrompt}
5. 隨機變化因子：${Date.now()}。

只回傳 JSON 陣列，每個元素格式：{"name":"菜名","time":數字(分鐘),"kcal":整數,"p":蛋白質克數,"c":碳水克數,"f":脂肪克數,"ingredients":["食材與份量",...],"steps":["步驟",...],"tip":"一句小提醒"}
步驟 3 到 5 步，每步一句。除了 JSON 陣列本體外，不要輸出任何其他文字或 Markdown 說明。`;

  S.busy=true;S.recipes=null;render();
  try{
    const arr=await callGemini(prompt, true, { temperature: 1.0 });
    const list=(Array.isArray(arr)?arr:[]).map(r=>({name:String(r.name||'').slice(0,40),time:Math.round(+r.time||0)||'',kcal:Math.round(+r.kcal||0),p:Math.round(+r.p||0),c:Math.round(+r.c||0),f:Math.round(+r.f||0),ingredients:(r.ingredients||[]).map(String).slice(0,14),steps:(r.steps||[]).map(String).slice(0,8),tip:String(r.tip||'').slice(0,80)})).filter(r=>r.name&&r.ingredients.length&&r.steps.length);
    if(!list.length) throw {code:'invalid_json'};
    lastRecipeNames = list.map(x => x.name);
    S.recipes=list;S.busy=false;render();
  }catch(e){console.error(e);toast('連線異常：' + (e.message || '請檢查 Key'), true);localRecipes();}
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.st){
    const row=t.closest('[data-i]');if(!row) return;
    const i=+row.dataset.i,k=t.dataset.st;
    if(k==='name') S.stage[i].name=t.value;

  }else if(t.id==='xMin'){recalcWork()}
  else if(t.id==='fSearch'){searchFood()}
  else if(t.id==='xKcal'){kcalTouched=t.value!==''}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden) closeSheet()});

/* ---------- boot ---------- */
(function(){
  Store.init();
  S.signed = !!GEMINI_API_KEY;
  S.ai = !!GEMINI_API_KEY;
  render();
  setInterval(fastTick,15000);
})();
})();
</script>
